<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseNews - 맞춤형 뉴스 리더</title>
  <meta name="description" content="비즈니스, 스포츠, 문화 등 관심 있는 주제의 최신 헤드라인을 실시간으로 확인하는 맞춤형 뉴스 리더 웹 앱">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="main-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
              <path d="M18 14h-8"/>
              <path d="M15 18h-5"/>
              <path d="M10 6h8v4h-8V6Z"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">PulseNews</h1>
            <p class="brand-subtitle">실시간 맞춤형 뉴스 리더</p>
          </div>
        </div>
        <div class="header-status">
          <span class="live-indicator">
            <span class="pulse-dot"></span> 실시간 OpenAPI 연동
          </span>
          <span class="date-display" id="currentDate"></span>
        </div>
      </div>
    </header>

    <!-- 필터 및 컨트롤 패널 -->
    <section class="control-panel" aria-label="뉴스 필터 패널">
      <div class="panel-card">
        <div class="panel-header">
          <div class="panel-title-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
            </svg>
            <h2>관심 주제 선택</h2>
            <span class="tooltip-badge">다중 선택 가능</span>
          </div>
          <div class="quick-select">
            <button type="button" class="btn-text" id="btnSelectAll">전체 선택</button>
            <span class="divider">|</span>
            <button type="button" class="btn-text" id="btnClearAll">선택 해제</button>
          </div>
        </div>

        <form id="filterForm" class="filter-form">
          <div class="topic-options" role="group" aria-label="뉴스 주제 목록">
            <!-- 비즈니스 -->
            <label class="topic-chip" data-category="business">
              <input type="checkbox" name="topic" value="business" checked>
              <div class="chip-content">
                <span class="chip-icon business-icon">💼</span>
                <div class="chip-text">
                  <span class="chip-name">비즈니스</span>
                  <span class="chip-desc">경제 · 금융 · 시장동향</span>
                </div>
                <div class="check-mark">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
              </div>
            </label>

            <!-- 스포츠 -->
            <label class="topic-chip" data-category="sports">
              <input type="checkbox" name="topic" value="sports" checked>
              <div class="chip-content">
                <span class="chip-icon sports-icon">⚽</span>
                <div class="chip-text">
                  <span class="chip-name">스포츠</span>
                  <span class="chip-desc">국내외 리그 · 선수 소식</span>
                </div>
                <div class="check-mark">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
              </div>
            </label>

            <!-- 문화 -->
            <label class="topic-chip" data-category="culture">
              <input type="checkbox" name="topic" value="culture" checked>
              <div class="chip-content">
                <span class="chip-icon culture-icon">🎨</span>
                <div class="chip-text">
                  <span class="chip-name">문화</span>
                  <span class="chip-desc">예술 · 라이프 · 엔터</span>
                </div>
                <div class="check-mark">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
              </div>
            </label>
          </div>

          <!-- 액션 영역 -->
          <div class="action-bar">
            <div class="selection-status" id="selectionCount">
              선택된 주제: <strong>3개</strong>
            </div>
            <button type="submit" class="btn-primary" id="btnFetchNews">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <span>뉴스 보기</span>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- 뉴스 피드 섹션 -->
    <main class="news-feed-section">
      <div class="feed-header">
        <div class="feed-title-wrap">
          <h2 class="feed-title" id="feedHeading">최신 헤드라인 피드</h2>
          <span class="feed-stats" id="feedCountBadge">0건 로드됨</span>
        </div>
        <div class="feed-filter-tags" id="activeFilterTags"></div>
      </div>

      <!-- 뉴스 카드 그리드 컨테이너 -->
      <div class="news-grid" id="newsGrid" aria-live="polite">
        <!-- JS로 동적 렌더링 -->
      </div>

      <!-- 무한 스크롤 및 로딩 인디케이터 -->
      <div class="scroll-footer" id="scrollFooter">
        <div class="loading-spinner-wrap" id="loadingSpinner" style="display: none;">
          <div class="spinner"></div>
          <p class="loading-text">새로운 기사를 불러오는 중입니다...</p>
        </div>
        <div class="end-of-feed" id="endOfFeed" style="display: none;">
          <div class="end-icon">✓</div>
          <p>모든 뉴스를 다 확인했습니다.</p>
        </div>
      </div>

      <!-- 감지용 센티넬 (Infinite Scroll Target) -->
      <div id="scrollSentinel" class="scroll-sentinel"></div>
    </main>

    <!-- 맨 위로 가기 플로팅 버튼 -->
    <button type="button" class="btn-scroll-top" id="btnScrollTop" aria-label="맨 위로 스크롤">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>
  </div>

  <!-- 기사 본문 상세 모달 다이얼로그 -->
  <div class="modal-backdrop" id="articleModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" style="display: none;">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-meta">
          <span class="modal-category-badge" id="modalCategory">카테고리</span>
          <span class="modal-date" id="modalDate">2026.10.09</span>
          <span class="modal-source" id="modalSource">출처</span>
        </div>
        <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="닫기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <h3 class="modal-title" id="modalTitle">기사 제목이 표시됩니다</h3>
        <div class="modal-image-wrapper">
          <img id="modalImage" src="" alt="기사 대표 이미지" class="modal-image" loading="lazy">
        </div>
        <div class="modal-content-text" id="modalContent">
          <!-- 기사 본문 내용 -->
        </div>
      </div>

      <div class="modal-footer">
        <a id="modalSourceLink" href="#" target="_blank" rel="noopener noreferrer" class="btn-external">
          <span>원문 전체 보기</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>
        <button type="button" class="btn-secondary" id="modalCloseAction">닫기</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
